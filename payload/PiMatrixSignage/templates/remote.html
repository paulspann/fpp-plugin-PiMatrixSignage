<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1118"><title>Pi Matrix Remote</title>
  <link rel="stylesheet" href="/static/app.css?v={{ app_version }}">
</head>
<body class="remote-body">
  <main class="remote-shell">
    <header class="remote-head"><div><h1>Pi Matrix Remote</h1><p>v{{ app_version }} · quick display control</p></div><a class="btn secondary" href="/">Full controls</a></header>
    <section class="remote-status card"><div class="status-pill" id="remoteStatus"><span class="dot"></span><span>Connecting…</span></div><strong id="remoteSource">—</strong><small id="remoteBrightness">Brightness —</small></section>
    <section class="card remote-emergency"><h2>Emergency</h2><p id="remoteEmergencyName" class="muted">Loading configured emergency message…</p><button class="btn danger remote-huge" id="remoteEmergency">ACTIVATE EMERGENCY</button><button class="btn secondary remote-wide" id="remoteEmergencyClear">END EMERGENCY</button></section>
    <section class="card"><h2>Show message</h2><select id="remoteMessage"></select><div class="remote-nav"><button class="btn secondary" id="remotePrev">◀ Previous</button><button class="btn primary" id="remoteShow">SHOW NOW</button><button class="btn secondary" id="remoteNext">Next ▶</button></div><button class="btn secondary remote-wide" id="remoteSchedule">Return to automatic schedule</button><button class="btn danger ghost remote-wide" id="remoteBlank">Blank display</button></section>
    <section class="card"><h2>Temporary brightness</h2><p class="muted">Overrides the normal brightness schedule until Auto is selected.</p><div class="remote-brightness"><button data-brightness="10">10%</button><button data-brightness="25">25%</button><button data-brightness="50">50%</button><button data-brightness="75">75%</button><button data-brightness="100">100%</button></div><button class="btn secondary remote-wide" id="remoteBrightnessAuto">Auto brightness</button></section>
    <div id="remoteToast" class="toast"></div>
  </main>
<script>
(()=>{'use strict';let csrf='',messages=[],settings=null;const $=id=>document.getElementById(id);
async function api(url,opts={}){const method=(opts.method||'GET').toUpperCase();opts.headers={...(opts.headers||{})};if(csrf&&!['GET','HEAD'].includes(method))opts.headers['X-CSRF-Token']=csrf;if(opts.body&&typeof opts.body!=='string'){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body);}const r=await fetch(url,opts);if(r.status===401){location.href='/login';throw new Error('Sign in required');}if(!r.ok){let m=`${r.status} ${r.statusText}`;try{const j=await r.json();m=j.error||m}catch(_){}throw new Error(m)}return (r.headers.get('content-type')||'').includes('json')?r.json():r;}
function toast(m,bad=false){const e=$('remoteToast');e.textContent=m;e.classList.toggle('error',bad);e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),2200)}
function nameFor(id){return messages.find(x=>+x.id===+id)?.name||`Message #${id}`}
async function init(){try{const auth=await api('/api/auth/me');csrf=auth.csrf_token;[settings,{messages}]=await Promise.all([api('/api/settings'),api('/api/content-options')]);window.messages=messages;const sel=$('remoteMessage');sel.innerHTML=messages.map(m=>`<option value="${m.id}">${String(m.name).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</option>`).join('');$('remoteEmergencyName').textContent=settings.emergency_message_id?`Configured: ${nameFor(settings.emergency_message_id)}`:'No emergency message configured. Set one under Schedules → Emergency mode.';await status();setInterval(status,1200);}catch(e){toast(e.message,true)}}
async function status(){try{const s=await api('/api/status'),p=$('remoteStatus');p.classList.toggle('ok',s.running&&!s.last_error);p.classList.toggle('error',!!s.last_error);p.querySelector('span:last-child').textContent=s.emergency?'EMERGENCY ACTIVE':s.last_error?'Output error':'Running';$('remoteSource').textContent=s.transition?`Transition · ${Number(s.transition.remaining||0).toFixed(1)}s`:s.emergency?`Emergency · ${nameFor(s.emergency.id)}`:s.manual?`Manual ${s.manual.type}`:s.active?`${s.active.source}`:'Blank';$('remoteBrightness').textContent=`Brightness ${s.brightness?.effective??'?'}% · ${s.brightness?.source||'auto'}`;$('remoteEmergency').disabled=!!s.emergency||!settings?.emergency_message_id;$('remoteEmergencyClear').disabled=!s.emergency;}catch(_){$('remoteStatus').classList.add('error');$('remoteStatus').querySelector('span:last-child').textContent='Disconnected'}}
async function post(url,body={},msg='Done'){try{await api(url,{method:'POST',body});toast(msg);setTimeout(status,100)}catch(e){toast(e.message,true)}}
$('remoteShow').onclick=()=>{const id=+$('remoteMessage').value;if(id)post(`/api/messages/${id}/show`,{},'Message shown')};
function move(d){if(!messages.length)return;let i=messages.findIndex(x=>+x.id===+$('remoteMessage').value);i=(i+d+messages.length)%messages.length;$('remoteMessage').value=messages[i].id;post(`/api/messages/${messages[i].id}/show`,{},messages[i].name)}
$('remotePrev').onclick=()=>move(-1);$('remoteNext').onclick=()=>move(1);$('remoteSchedule').onclick=()=>post('/api/show/clear',{},'Automatic schedule restored');$('remoteBlank').onclick=()=>post('/api/show/blank',{},'Display blanked');$('remoteEmergency').onclick=()=>{if(confirm('Activate the emergency message now?'))post('/api/emergency/activate',{},'Emergency activated')};$('remoteEmergencyClear').onclick=()=>post('/api/emergency/clear',{},'Emergency ended');document.querySelectorAll('[data-brightness]').forEach(b=>b.onclick=()=>post('/api/brightness/override',{brightness:+b.dataset.brightness},`Brightness ${b.dataset.brightness}%`));$('remoteBrightnessAuto').onclick=()=>post('/api/brightness/override',{brightness:null},'Automatic brightness restored');init();})();
</script>
</body></html>
